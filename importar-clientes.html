function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2)}

function log(msg, cls){
  const el = document.getElementById('log');
  el.style.display = 'block';
  const line = document.createElement('div');
  if(cls) line.className = cls;
  line.textContent = msg;
  el.appendChild(line);
  el.scrollTop = el.scrollHeight;
}

window.hacerLogin = async function(){
  const email = document.getElementById('email').value.trim();
  const pass = document.getElementById('pass').value;
  const btn = document.getElementById('btn-login');
  btn.disabled = true; btn.textContent = 'Ingresando...';
  try{
    await signInWithEmailAndPassword(auth, email, pass);
    document.getElementById('login-box').style.display = 'none';
    document.getElementById('import-box').style.display = 'block';
    document.getElementById('estado-sesion').textContent = 'Sesión iniciada como ' + email;
  }catch(e){
    console.error(e);
    alert('No se pudo iniciar sesión: ' + e.message);
    btn.disabled = false; btn.textContent = 'Iniciar sesión';
  }
}

window.importarClientes = async function(){
  const btn = document.getElementById('btn-import');
  btn.disabled = true; btn.textContent = 'Importando...';
  log('Revisando clientes ya existentes en Firestore...');

  const existentesSnap = await getDocs(collection(db, 'clientes'));
  const rutsExistentes = new Set();
  existentesSnap.forEach(d => {
    const r = (d.data().rut || '').toString().trim().toLowerCase();
    if(r) rutsExistentes.add(r);
  });
  log('Clientes ya cargados en el sistema: ' + rutsExistentes.size, 'warn');

  let creados = 0, saltados = 0, errores = 0;
  for(const c of CLIENTES){
    const rutNorm = (c.rut || '').toString().trim().toLowerCase();
    if(rutNorm && rutsExistentes.has(rutNorm)){
      log('— Ya existe, se omite: ' + c.razonSocial, 'warn');
      saltados++;
      continue;
    }
    try{
      const id = uid();
      await setDoc(doc(db, 'clientes', id), {
        id, rut: c.rut || '', razonSocial: c.razonSocial || '', giro: c.giro || '',
        direccion: c.direccion || '', creadoPor: 'importacion-inicial', _tsCreacion: Date.now(), _ts: Date.now()
      });
      log('✓ Creado: ' + c.razonSocial, 'ok');
      creados++;
      if(rutNorm) rutsExistentes.add(rutNorm);
    }catch(e){
      console.error(e);
      log('✗ Error con ' + c.razonSocial + ': ' + e.message, 'err');
      errores++;
    }
  }

  log('----------------------------------------');
  log('Listo. Creados: ' + creados + '  ·  Omitidos (ya existían): ' + saltados + '  ·  Errores: ' + errores, 'ok');
  btn.textContent = 'Importación finalizada';
}
