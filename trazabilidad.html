<title>Trazabilidad MAFLES</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',sans-serif;background:#f4f6f3;min-height:100vh;padding:0 0 40px}
  .header{background:#1a4a2e;padding:16px 20px;display:flex;align-items:center;gap:12px}
  .header-logo{width:80px;height:40px;background:#fff;border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:3px 6px}
  .header-txt .sub{font-size:10px;color:rgba(255,255,255,0.55);letter-spacing:1.5px;text-transform:uppercase}
  .header-txt .title{font-size:18px;font-weight:700;color:#fff;margin-top:2px}
  .badge-vista{display:inline-block;font-size:10px;padding:2px 10px;border-radius:20px;margin-top:4px;font-weight:600}
  .badge-publica{background:rgba(125,214,154,0.2);color:#7dd69a;border:1px solid rgba(125,214,154,0.3)}
  .content{max-width:520px;margin:0 auto;padding:16px}
  .card{background:#fff;border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,0.07)}
  .section-title{font-size:11px;font-weight:700;color:#1a4a2e;letter-spacing:1px;text-transform:uppercase;margin-bottom:12px;padding-bottom:6px;border-bottom:1px solid #e8f5e9}
  .row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:0.5px solid #f0f0f0}
  .row:last-child{border:none}
  .lbl{font-size:13px;color:#888}
  .val{font-size:13px;font-weight:600;color:#222;text-align:right}
  .badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600}
  .badge-ok{background:#e8f5e9;color:#1a4a2e}
  .badge-warn{background:#fff8e1;color:#e65100}
  .badge-err{background:#fde8e8;color:#c0392b}
  .tbl-wrap{overflow-x:auto;margin-top:8px}
  table{width:100%;border-collapse:collapse;font-size:12px}
  th{background:#f0f8f0;color:#1a4a2e;padding:8px 8px;text-align:left;font-weight:600;border-bottom:1px solid #d0e8d0}
  td{padding:7px 8px;border-bottom:0.5px solid #f0f0f0;color:#333}
  .cumple-ok{color:#1a4a2e;font-weight:700}
  .cumple-no{color:#c0392b;font-weight:700}
  .error-box{background:#fde8e8;border:1px solid #f5c6c6;border-radius:8px;padding:16px;color:#c0392b;text-align:center;margin-top:20px}
  .loading{text-align:center;color:#888;padding:40px;font-size:14px}
  .footer{text-align:center;font-size:11px;color:#aaa;margin-top:8px}
  .btn-pdf{display:block;width:100%;margin-top:10px;padding:10px;background:#1a4a2e;color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer}
  .btn-pdf:active{opacity:0.85}
</style>

function fmtFecha(s){
  if(!s)return 'N/A';
  if(s.includes('-')){const[y,m,d]=s.split('-');return d+'-'+m+'-'+y;}
  return s;
}
function fmtNum(n){
  if(!n&&n!==0)return '0';
  return Number(n).toLocaleString('es-CL',{minimumFractionDigits:1,maximumFractionDigits:1});
}
function estadoVisual(evalObj){
  if(!evalObj)return{txt:'Sin evaluación',cls:'badge-warn'};
  const vals=Object.values(evalObj);
  const severo=vals.filter(v=>v==='Severo').length;
  const moderado=vals.filter(v=>v==='Moderado').length;
  if(severo>0)return{txt:'Rechazado',cls:'badge-err'};
  if(moderado>2)return{txt:'Observado',cls:'badge-warn'};
  return{txt:'Aceptado',cls:'badge-ok'};
}
function cumpleCarencia(cosecha, fechaRecepcion){
  if(!cosecha||cosecha===''||cosecha==='N/A')return{ok:true,txt:'\u2713 N/A'};
  const fRef = fechaRecepcion ? new Date(fechaRecepcion) : new Date();
  fRef.setHours(0,0,0,0);
  const fc=new Date(cosecha);fc.setHours(0,0,0,0);
  const ok=fRef>=fc;
  const dias=Math.ceil((fc-fRef)/(1000*60*60*24));
  return{ok,txt:ok?'✓ OK':'Faltan '+dias+'d'};
}

function renderVistaPublica(r, agros){
  let html='<div class="card">';
  html+='<div class="section-title">Datos del lote</div>';
  html+='<div class="row"><span class="lbl">Especie</span><span class="val">'+r.especie+'</span></div>';
  html+='<div class="row"><span class="lbl">Cantidad bandejas</span><span class="val">'+(r.bandejas||0)+'</span></div>';
  if(r.kg) html+='<div class="row"><span class="lbl">Kilos recepcionados</span><span class="val">'+Number(r.kg).toLocaleString('es-CL',{minimumFractionDigits:1,maximumFractionDigits:1})+' kg</span></div>';
  if(r.especie==='Arándano'&&r.sag_prod){
    html+='<div class="row"><span class="lbl">Código SAG productor</span><span class="val">'+r.sag_prod+'</span></div>';
  }
  html+='</div>';

  html+='<div class="card">';
  html+='<div class="section-title">Agroquímicos aplicados al cultivo</div>';
  if(agros.length===0){
    html+='<div style="color:#aaa;text-align:center;padding:16px">Sin registros de agroquímicos</div>';
  }else{
    html+='<div class="tbl-wrap"><table><thead><tr><th>Producto</th><th>N° SAG</th><th>Ingr. activo</th><th>Dosis</th><th>Fecha Aplic.</th><th>Carencia</th><th>Cumple</th></tr></thead><tbody>';
    agros.forEach(a=>{
      const cum=cumpleCarencia(a.cosecha, r.fecha);
      html+='<tr>';
      html+='<td><strong>'+a.agroquimico+'</strong></td>';
      html+='<td>'+(a.sag||'-')+'</td>';
      html+='<td>'+(a.pa||'-')+'</td>';
      html+='<td>'+(a.dosis||'-')+'</td>';
      html+='<td>'+fmtFecha(a.fecha)+'</td>';
      html+='<td>'+(a.carencia||'-')+'d</td>';
      html+='<td class="'+(cum.ok?'cumple-ok':'cumple-no')+'">'+cum.txt+'</td>';
      html+='</tr>';
    });
    html+='</tbody></table></div>';
  }
  html+='<button class="btn-pdf" onclick="window.descargarPDFTrazabilidad()">⬇ Descargar PDF</button>';
  html+='</div>';
  return html;
}

async function cargarTrazabilidadPartida(app,db,cont){
  const recSnap=await getDoc(doc(db,'recepciones',recepId));
  if(!recSnap.exists()){
    cont.innerHTML='<div class="error-box">⚠️ Registro no encontrado (ID: '+recepId+')</div>';
    return;
  }
  const r=recSnap.data();

  const obtenerAgroquimicos = httpsCallable(getFunctions(app,'us-central1'), 'obtenerAgroquimicos');
  const agrosResp = await obtenerAgroquimicos({proveedor:r.proveedor, especie:r.especie});
  const agros = agrosResp.data.items || [];

  const nCorr=String(r.correlativo || 0).padStart(4,'0');
  document.getElementById('hdr-title').textContent='TRZ-'+nCorr+' — '+r.especie;

  _dataR=r; _dataAgros=agros;
  cont.innerHTML=renderVistaPublica(r, agros);
}

async function cargarTrazabilidadConsolidada(app,db,cont){
  const ccSnap=await getDoc(doc(db,'consolidadas',consolidadoId));
  if(!ccSnap.exists()){
    cont.innerHTML='<div class="error-box">⚠️ Carga consolidada no encontrada (ID: '+consolidadoId+')</div>';
    return;
  }
  const cc=ccSnap.data();

  document.getElementById('hdr-title').textContent='Consolidado — '+cc.especie+' · '+cc.cliente;

  // Para cada partida incluida, traer sus agroquímicos de campo
  const detalle=[];
  for(const p of (cc.partidasIncluidas||[])){
    const obtenerAgroquimicos = httpsCallable(getFunctions(app,'us-central1'), 'obtenerAgroquimicos');
    const agrosResp = await obtenerAgroquimicos({proveedor:p.proveedor, especie:cc.especie});
    const agros = agrosResp.data.items || [];
    detalle.push({proveedor:p.proveedor,kilosAportados:p.kilosAportados,agros});
  }

  _dataCC=cc; _dataDetalle=detalle;
  cont.innerHTML=renderVistaConsolidadaPublica(cc, detalle);
}

  if(r.bandejas) { pdf.text('Cantidad bandejas: '+r.bandejas, 14, infoY); infoY+=6; }
  if(r.kg) { pdf.text('Kilos recepcionados: '+Number(r.kg).toLocaleString('es-CL',{minimumFractionDigits:1,maximumFractionDigits:1})+' kg', 14, infoY); infoY+=6; }

  const rows=(agros||[]).map(a=>[fmtFecha(a.fecha), a.agroquimico||'-', a.pa||'-', a.dosis||'-', (a.carencia||'-')+' d']);

  pdf.autoTable({
    startY: infoY+4,
    head: [['Fecha','Producto','Ingrediente activo','Dosis','Carencia']],
    body: rows.length?rows:[['-','Sin registros de agroquímicos','-','-','-']],
    headStyles:{fillColor:verde,textColor:255,fontSize:9},
    styles:{fontSize:9,cellPadding:3},
    margin:{left:14,right:14}
  });

  pdf.save('TRZ-'+nCorr+'.pdf');
}

function generarPDFConsolidado(cc, detalle){
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF();
  const verde=[26,74,46];

  pdf.setFontSize(16);
  pdf.setTextColor(verde[0],verde[1],verde[2]);
  pdf.text('Carga Consolidada — MAFLES', 14, 18);

  pdf.setFontSize(10);
  pdf.setTextColor(90,90,90);
  pdf.text('Cliente: '+(cc.cliente||'-'), 14, 26);
  pdf.text('Especie: '+(cc.especie||'-'), 14, 32);
  pdf.text('Fecha despacho: '+fmtFecha(cc.fechaDespacho), 14, 38);
  pdf.text('Kilos totales: '+fmtNum(cc.kilosTotales)+' kg', 14, 44);

  let y=52;
  const agrosTotal=[];
  (detalle||[]).forEach(d=>{ (d.agros||[]).forEach(a=>agrosTotal.push(a)); });
  const rows=agrosTotal.map(a=>[fmtFecha(a.fecha), a.agroquimico||'-', a.pa||'-', a.dosis||'-', (a.carencia||'-')+' d']);
  pdf.autoTable({
    startY:y,
    head:[['Fecha','Producto','Ingrediente activo','Dosis','Carencia']],
    body: rows.length?rows:[['-','Sin registros de agroquímicos','-','-','-']],
    headStyles:{fillColor:verde,textColor:255,fontSize:8},
    styles:{fontSize:8,cellPadding:2.5},
    margin:{left:14,right:14}
  });

  const fechaArchivo=(cc.fechaDespacho||new Date().toISOString().slice(0,10));
  pdf.save('Consolidado-'+(cc.especie||'Carga')+'-'+fechaArchivo+'.pdf');
}

window.descargarPDFTrazabilidad = function(){
  if(consolidadoId && _dataCC){
    generarPDFConsolidado(_dataCC, _dataDetalle);
  } else if(_dataR){
    generarPDFIndividual(_dataR, _dataAgros);
  } else {
    alert('Los datos aún se están cargando, intenta de nuevo en un segundo.');
  }
};

async function cargarTrazabilidad(){
  const cont=document.getElementById('main-content');
  if(!recepId && !consolidadoId){
    cont.innerHTML='<div class="loading">⏳ Cargando...</div>';
    return;
  }
  try{
    const app=initializeApp(firebaseConfig);
    const db=getFirestore(app);

    if(consolidadoId){
      await cargarTrazabilidadConsolidada(app,db,cont);
    } else {
      await cargarTrazabilidadPartida(app,db,cont);
    }

  }catch(err){
    cont.innerHTML='<div class="error-box">⚠️ Error cargando datos:<br>'+err.message+'</div>';
    console.error(err);
  }
}

cargarTrazabilidad();
</script>
